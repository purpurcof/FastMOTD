name: Java CI with Gradle

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Set up JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 21
      - name: Build FastMOTD
        run: ./gradlew build
      - name: Upload FastMOTD
        uses: actions/upload-artifact@v7.0.0
        with:
          name: FastMOTD
          path: "build/libs/FastMOTD*.jar"
      - uses: dev-drprasad/delete-tag-and-release@v1.1
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        with:
          delete_release: true
          tag_name: dev-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Find git version
        id: git-version
        run: echo "id=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Find correct JAR
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        id: find-jar
        run: |
          output="$(find build/libs/ ! -name "*-javadoc.jar" ! -name "*-sources.jar" -type f -printf "%f\n")"
          echo "jarname=$output" >> $GITHUB_OUTPUT
      - name: Release the build
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: build/libs/${{ steps.find-jar.outputs.jarname }}
          body: ${{ github.event.commits != null && join(github.event.commits.*.message, '\n') || 'Manual build' }}
          prerelease: true
          name: Dev-build ${{ steps.git-version.outputs.id }}
          tag: dev-build
      - name: Upload to Modrinth
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.MODRINTH_TOKEN != '' }}
        uses: RubixDev/modrinth-upload@v1
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          file_path: build/libs/${{ steps.find-jar.outputs.jarname }}
          name: Dev-build ${{ steps.git-version.outputs.id }}
          version: ${{ steps.git-version.outputs.id }}
          changelog: ${{ github.event.commits != null && join(github.event.commits.*.message, '\n') || 'Manual build' }}
          game_versions: 1.7.2
          release_type: beta
          loaders: velocity
          featured: false
          project_id: OfMfkdiO
