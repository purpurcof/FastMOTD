name: Java CI with Gradle

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        required: true
        default: 'manual-release'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Set up JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 21
      - name: Build FastMOTD
        run: ./gradlew build
      - name: Upload FastMOTD
        uses: actions/upload-artifact@v7.0.0
        with:
          name: FastMOTD
          path: "build/libs/FastMOTD*.jar"
      - name: Find correct JAR
        id: find-jar
        run: |
          output="$(find build/libs/ ! -name "*-javadoc.jar" ! -name "*-sources.jar" -type f -printf "%f\n")"
          echo "jarname=$output" >> $GITHUB_OUTPUT
      - name: Upload to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/${{ steps.find-jar.outputs.jarname }}
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
          body: ${{ github.event.release.body || 'Manual build/release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
